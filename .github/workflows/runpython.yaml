name: Run Python Script
on: [push]
env:
  gemini_api_key: ${{ secrets.GEMINI_API_KEY }} 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python path/to/your_script.py
